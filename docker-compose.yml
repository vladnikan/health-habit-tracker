version: "3.9"

services:

  # База данных
  db:
    image: postgres:15
    container_name: habit_db
    environment:
      POSTGRES_DB: habitdb
      POSTGRES_USER: habituser
      POSTGRES_PASSWORD: habitpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habituser -d habitdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Бэкенд
  backend:
    build: ./backend
    container_name: habit_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://habituser:habitpass@db:5432/habitdb
      SECRET_KEY: your_secret_key_here
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      GROQ_API_KEY: your_groq_key_here
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # Фронтенд
  frontend:
    build: ./frontend
    container_name: habit_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: